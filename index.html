<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Renato Miguel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            background: #f7f7f5;
            color: #171717;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .container {
            padding: 40px 24px;
            max-width: 650px;
        }

        h1 {
            margin: 0 0 20px;
            font-size: clamp(2.5rem, 7vw, 5rem);
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        p {
            margin: 0;
            font-size: 1.15rem;
            line-height: 1.7;
            color: #666;
        }

        .line {
            width: 50px;
            height: 2px;
            background: #171717;
            margin: 30px auto;
        }

        footer {
            margin-top: 50px;
            font-size: 0.85rem;
            color: #999;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Renato Miguel</h1>

        <div class="line"></div>

        <p>
            Something new is being built here.<br>
            Please check back soon.
        </p>

        <footer>
            © 2026 Renato Miguel
        </footer>

    </main>

</body>
</html>
